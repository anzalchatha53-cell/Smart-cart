<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Cart AI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Orbitron:wght@700;900&display=swap');

        :root {
            --bg-body: #030712;
            --card-bg: rgba(17, 24, 39, 0.65);
            --card-border: rgba(99, 102, 241, 0.35);
            --input-bg: rgba(31, 41, 55, 0.7);
            --text-main: #f9fafb;
            --text-sub: #9ca3af;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%);
            --primary-glow: 0 0 25px rgba(139, 92, 246, 0.5);
        }

        .light-mode {
            --bg-body: #e0e7ff;
            --card-bg: rgba(255, 255, 255, 0.75);
            --card-border: rgba(99, 102, 241, 0.4);
            --input-bg: rgba(243, 244, 246, 0.95);
            --text-main: #0f172a;
            --text-sub: #475569;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100dvh;
            background: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(25px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-left: 1px solid var(--card-border);
            border-right: 1px solid var(--card-border);
            position: relative;
        }

        .header {
            padding: 16px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 40%, #e879f9 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .controls { display: flex; gap: 6px; }

        select, button {
            background: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 6px 10px;
            border-radius: 10px;
            font-size: 0.8rem;
            outline: none;
            cursor: pointer;
        }

        .tab-bar {
            display: flex;
            background: var(--card-bg);
            padding: 6px;
            margin: 12px 12px 0;
            border-radius: 16px;
            border: 1px solid var(--card-border);
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: var(--text-sub);
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
        }

        .tab-btn.active {
            background: var(--primary-gradient);
            color: #ffffff;
            box-shadow: var(--primary-glow);
        }

        .view-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            padding-bottom: 85px;
            display: none;
            flex-direction: column;
        }

        .view-content.active { display: flex; }

        .glass-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .budget-header { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 8px; font-weight: 700; }

        .progress-bar-bg {
            height: 12px;
            background: var(--input-bg);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
            border: 1px solid var(--card-border);
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #06b6d4, #10b981, #a855f7);
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .add-item-form { display: flex; flex-direction: column; gap: 12px; }
        .input-row-equal { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        input[type="text"], input[type="number"] {
            background: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 12px 14px;
            border-radius: 14px;
            font-size: 0.85rem;
            outline: none;
            width: 100%;
        }

        .btn-add {
            flex: 1;
            background: var(--primary-gradient);
            color: white;
            border: none;
            font-weight: 800;
            padding: 12px;
            border-radius: 14px;
            cursor: pointer;
        }

        .list-container { flex: 1; display: flex; flex-direction: column; gap: 10px; }

        .list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 14px 16px;
            border-radius: 16px;
        }

        .chat-container { flex: 1; display: flex; flex-direction: column; gap: 10px; height: 100%; }
        .chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }

        .chat-bubble { 
            max-width: 90%; 
            padding: 14px 18px; 
            border-radius: 18px; 
            font-size: 0.88rem; 
            line-height: 1.5; 
        }

        .chat-bubble.user { 
            align-self: flex-end; 
            background: var(--primary-gradient); 
            color: white; 
            border-bottom-right-radius: 4px; 
        }

        .chat-bubble.ai { 
            align-self: flex-start; 
            background: var(--card-bg); 
            color: var(--text-main); 
            border-bottom-left-radius: 4px; 
            border: 1px solid var(--card-border); 
        }

        .badge-live {
            background: rgba(217, 70, 239, 0.2);
            color: #d946ef;
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: 700;
            margin-left: 6px;
        }

        .suggestion-chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; }
        .chip-btn { 
            white-space: nowrap; 
            background: var(--card-bg); 
            border: 1px solid var(--card-border); 
            font-size: 0.78rem; 
            padding: 7px 14px; 
            border-radius: 18px; 
            cursor: pointer;
            color: var(--text-main);
        }

        .chat-input-area { display: flex; gap: 8px; }
        .chat-input-area input { flex: 1; }

        .add-from-ai-btn {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid #10b981;
            padding: 9px 14px;
            border-radius: 10px;
            margin-top: 10px;
            font-size: 0.82rem;
            cursor: pointer;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .whatsapp-fixed-wrapper {
            position: absolute; bottom: 0; left: 0; right: 0;
            padding: 14px; background: var(--card-bg);
            border-top: 1px solid var(--card-border);
        }

        .whatsapp-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white; border: none; font-weight: 800;
            padding: 13px; border-radius: 14px; width: 100%; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <h1>🛒 Smart Cart AI</h1>
            <div class="controls">
                <select id="currencySelect" onchange="render()">
                    <option value="PKR">PKR</option>
                    <option value="USD">USD</option>
                </select>
                <button onclick="toggleTheme()">🌗</button>
            </div>
        </div>

        <div class="tab-bar">
            <button class="tab-btn active" id="tabCartBtn" onclick="switchTab('cart')">🛒 Cart</button>
            <button class="tab-btn" id="tabAiBtn" onclick="switchTab('ai')">✨ AI Assistant</button>
        </div>

        <div class="view-content active" id="cartView">
            <div class="glass-card">
                <div class="budget-header">
                    <span>⚡ Budget Tracker</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progressBar"></div>
                </div>
                <div style="display:flex; justify-content:space-between; font-size:0.8rem;">
                    <span>Spent: <b id="totalSpent">0 PKR</b></span>
                    <span id="progressPercent">0% Used</span>
                </div>
                <div style="margin-top:10px; display:flex; align-items:center; gap:8px;">
                    <label style="font-size:0.8rem; color:var(--text-sub)">Limit:</label>
                    <input type="number" id="budgetLimit" value="50000" style="padding:6px 10px; flex:1;" onchange="saveState(); render();">
                </div>
            </div>

            <div class="glass-card add-item-form">
                <input type="text" id="itemName" placeholder="📦 Item Name">
                <div class="input-row-equal">
                    <input type="number" id="itemPrice" placeholder="💰 Price">
                    <input type="number" id="itemQty" value="1" placeholder="🔢 Qty">
                </div>
                <button class="btn-add" onclick="addItem()">⚡ Add Item</button>
            </div>

            <div class="list-container" id="listBody"></div>

            <div class="whatsapp-fixed-wrapper">
                <button class="whatsapp-btn" onclick="shareToWhatsApp()">📲 Share List on WhatsApp</button>
            </div>
        </div>

        <div class="view-content" id="aiView">
            <div class="chat-container">
                <div class="chat-messages" id="chatMessages">
                    <div class="chat-bubble ai">
                        Salam! Zenserp Search Engine Active. Real-time product search karein! 🌐
                    </div>
                </div>

                <div class="suggestion-chips">
                    <button class="chip-btn" onclick="quickSearch('petrol price in pakistan')">💡 Petrol price</button>
                    <button class="chip-btn" onclick="quickSearch('core i5 12th gen price in pakistan')">💡 Core i5 12th Gen</button>
                    <button class="chip-btn" onclick="quickSearch('egg dozen price in pakistan')">💡 Egg 1 dozen</button>
                </div>

                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="Ask e.g. petrol price" onkeypress="if(event.key==='Enter') executeZenserpSearch()">
                    <button class="btn-add" onclick="executeZenserpSearch()">Search</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const ZENSERP_KEY = "4268bb80-90e2-11f1-84e7-632b04821c16";

        let state = {
            currency: 'PKR',
            budget: JSON.parse(localStorage.getItem('CART_BUDGET')) || 50000,
            items: JSON.parse(localStorage.getItem('CART_ITEMS')) || []
        };

        function saveState() {
            localStorage.setItem('CART_ITEMS', JSON.stringify(state.items));
            localStorage.setItem('CART_BUDGET', JSON.stringify(parseFloat(document.getElementById('budgetLimit').value) || 0));
        }

        function switchTab(tab) {
            document.getElementById('cartView').classList.toggle('active', tab === 'cart');
            document.getElementById('aiView').classList.toggle('active', tab === 'ai');
            document.getElementById('tabCartBtn').classList.toggle('active', tab === 'cart');
            document.getElementById('tabAiBtn').classList.toggle('active', tab === 'ai');
        }

        function toggleTheme() { document.body.classList.toggle('light-mode'); }

        function addItem(name = null, price = null, qty = 1) {
            const finalName = name || document.getElementById('itemName').value.trim();
            const finalPrice = price !== null ? parseFloat(price) : parseFloat(document.getElementById('itemPrice').value);
            const finalQty = qty || parseInt(document.getElementById('itemQty').value) || 1;

            if (!finalName || isNaN(finalPrice)) return alert('Name aur Price enter karein!');

            state.items.push({ id: Date.now(), name: finalName, price: finalPrice, qty: finalQty });
            if (!name) {
                document.getElementById('itemName').value = '';
                document.getElementById('itemPrice').value = '';
            }
            saveState(); render();
        }

        function deleteItem(id) {
            state.items = state.items.filter(i => i.id !== id);
            saveState(); render();
        }

        function render() {
            state.currency = document.getElementById('currencySelect').value;
            const budget = parseFloat(document.getElementById('budgetLimit').value) || 0;
            const totalSpent = state.items.reduce((sum, item) => sum + (item.price * item.qty), 0);

            document.getElementById('totalSpent').textContent = `${totalSpent} ${state.currency}`;
            const percent = budget > 0 ? Math.min((totalSpent / budget) * 100, 100) : 0;
            document.getElementById('progressBar').style.width = `${percent}%`;
            document.getElementById('progressPercent').textContent = `${percent.toFixed(0)}% Used`;

            const listBody = document.getElementById('listBody');
            listBody.innerHTML = '';
            state.items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'list-item';
                card.innerHTML = `
                    <div>
                        <b>${item.name}</b><br>
                        <small>${item.price} ${state.currency} x ${item.qty}</small>
                    </div>
                    <b>${item.price * item.qty}</b>
                    <button onclick="deleteItem(${item.id})" style="border:none; background:transparent; color:red; cursor:pointer;">🗑️</button>
                `;
                listBody.appendChild(card);
            });
        }

        function quickSearch(query) {
            document.getElementById('chatInput').value = query;
            executeZenserpSearch();
        }

        // ZENSERP SEARCH + CORS PROXY ENGINE
        async function executeZenserpSearch() {
            const input = document.getElementById('chatInput');
            const userQuery = input.value.trim();
            if (!userQuery) return;

            const chatMessages = document.getElementById('chatMessages');
            chatMessages.innerHTML += `<div class="chat-bubble user">${userQuery}</div>`;
            input.value = '';

            const loadingBubble = document.createElement('div');
            loadingBubble.className = 'chat-bubble ai';
            loadingBubble.innerHTML = `🔍 Fetching live data for "<b>${userQuery}</b>"...`;
            chatMessages.appendChild(loadingBubble);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const targetUrl = `https://app.zenserp.com/api/v2/search?apikey=${ZENSERP_KEY}&q=${encodeURIComponent(userQuery)}&gl=PK&hl=en`;
                
                // Proxying to bypass CORS security block on browsers
                const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;

                const res = await fetch(proxyUrl);
                const data = await res.json();

                let snippetText = "";
                let detectedPrice = 0;

                if (data.organic && data.organic.length > 0) {
                    const topResult = data.organic[0];
                    snippetText = topResult.snippet || topResult.title || "";
                    
                    // Regex extractor for exact PKR price
                    const matches = snippetText.match(/(?:Rs\.?|PKR|\$)\s*([\d,]+)/i) || snippetText.match(/([\d,]+)\s*(?:PKR|Rs)/i);
                    if (matches && matches[1]) {
                        detectedPrice = parseFloat(matches[1].replace(/,/g, ''));
                    }
                }

                if (!detectedPrice) {
                    // Fallback scanner for numbers inside snippet
                    const numMatch = snippetText.match(/\b\d{3,6}\b/g);
                    if (numMatch) detectedPrice = parseFloat(numMatch[0]);
                }

                if (detectedPrice > 0) {
                    loadingBubble.innerHTML = `
                        <b>🤖 Assistant</b> <span class="badge-live">live price</span><br><br>
                        ${snippetText}<br><br>
                        <button class="add-from-ai-btn" onclick="addItem('${userQuery}', ${detectedPrice}, 1); switchTab('cart');">
                            + 🛍️ ${userQuery} - Rs ${detectedPrice}
                        </button>
                    `;
                } else {
                    loadingBubble.innerHTML = `
                        <b>🤖 Assistant</b><br><br>
                        Result mil gaya, par price clear nahi thi. Market snippet:<br>"${snippetText.substring(0, 120)}..."
                    `;
                }

            } catch (err) {
                loadingBubble.innerHTML = `⚠️ Fetching Error: Network issue ya API limit exceed ho gayi hai.`;
            }
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function shareToWhatsApp() {
            let msg = `🛒 *Smart Cart List*\n\n`;
            state.items.forEach((item, i) => msg += `${i+1}. ${item.name} - ${item.price} x ${item.qty}\n`);
            window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
        }

        render();
    </script>
</body>
</html>
