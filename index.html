<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Cart Pro - AI Assistant</title>
    <style>
        :root {
            --bg-body: #05070b;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-gradient: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
            --glow-color: rgba(99, 102, 241, 0.15);
            --danger: #ef4444;
            --success: #10b981;
        }

        .light-mode {
            --bg-body: #f1f5f9;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(0, 0, 0, 0.08);
            --text-main: #0f172a;
            --text-sub: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            overflow: hidden;
            transition: background-color 0.3s ease;
        }

        .app-frame {
            width: 100%;
            max-width: 420px;
            height: 100dvh;
            max-height: 900px;
            background: var(--bg-body);
            background-image: radial-gradient(circle at top right, rgba(99, 102, 241, 0.12), transparent 40%),
                              radial-gradient(circle at bottom left, rgba(236, 72, 153, 0.08), transparent 40%);
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 12px;
            position: relative;
            overflow: hidden;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 4px;
        }

        .app-title {
            font-size: 1.4rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        .icon-btn:active { transform: scale(0.92); }

        .nav-tabs {
            display: flex;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 4px;
            gap: 4px;
            backdrop-filter: blur(12px);
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-sub);
            padding: 8px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: var(--accent-gradient);
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .view-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow: hidden;
            display: none;
        }

        .view-container.active {
            display: flex;
        }

        /* Budget Card Style */
        .budget-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 10px 30px var(--glow-color);
            backdrop-filter: blur(16px);
            transition: all 0.4s ease;
        }

        .budget-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .mood-container {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .anim-emoji { font-size: 1.6rem; display: inline-block; }
        .happy-bounce { animation: bounce 1.2s infinite ease-in-out; }
        .sad-wiggle { animation: wiggle 2s infinite ease-in-out; }
        .full-sad-droop { animation: pulse 1.5s infinite ease-in-out; }
        .angry-shake { animation: shakeAngry 0.3s infinite ease-in-out; }

        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px) scale(1.1); } }
        @keyframes wiggle { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(0.92); opacity: 1; } }
        @keyframes shakeAngry { 
            0% { transform: translate(0, 0) rotate(0deg); } 
            25% { transform: translate(-2px, 1px) rotate(-3deg); }
            50% { transform: translate(2px, -1px) rotate(3deg); }
            75% { transform: translate(-1px, -1px) rotate(-2deg); }
            100% { transform: translate(1px, 2px) rotate(2deg); }
        }

        .budget-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
        .budget-input { width: 110px; text-align: center; padding: 6px; font-weight: 700; border-radius: 10px; }

        .progress-track {
            width: 100%; height: 10px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px; overflow: hidden;
        }

        .progress-fill {
            height: 100%; width: 0%;
            background: var(--success);
            transition: width 0.4s ease, background-color 0.3s ease;
            border-radius: 10px;
        }

        /* Settings Bar */
        .settings-bar {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 10px;
            display: flex;
            gap: 8px;
            backdrop-filter: blur(12px);
        }

        .select-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .select-group label {
            font-size: 0.65rem;
            color: var(--text-sub);
            text-transform: uppercase;
            font-weight: 700;
        }

        select, input {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 8px 10px;
            border-radius: 10px;
            outline: none;
            font-size: 0.88rem;
            width: 100%;
        }

        /* List & Add Container */
        .input-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            backdrop-filter: blur(12px);
        }

        .row-two { display: flex; gap: 8px; }

        .submit-btn {
            background: var(--accent-gradient); color: white; border: none;
            padding: 11px; border-radius: 12px; font-weight: 700; cursor: pointer; width: 100%;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            transition: transform 0.2s ease;
        }
        .submit-btn:active { transform: scale(0.96); }

        .list-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-bottom: 4px; }

        .list-item {
            background: var(--card-bg); border: 1px solid var(--card-border);
            padding: 12px; border-radius: 14px; display: flex; align-items: center; gap: 10px;
            backdrop-filter: blur(12px);
        }

        .item-info { flex: 1; display: flex; flex-direction: column; gap: 2px; }
        .item-name { font-size: 0.9rem; font-weight: 600; }
        .completed-text { text-decoration: line-through; opacity: 0.4; }

        .qty-picker {
            display: flex; align-items: center; gap: 6px;
            background: rgba(0, 0, 0, 0.25); padding: 4px 8px; border-radius: 10px;
        }

        .qty-btn { background: transparent; border: none; color: var(--text-main); width: 22px; height: 22px; cursor: pointer; font-weight: bold; }

        .export-btn {
            background: linear-gradient(135deg, #10b981, #059669); color: white;
            border: none; padding: 12px; border-radius: 14px; font-weight: 700;
            display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        /* AI Chatbot View Style */
        .chat-box {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(16px);
        }

        .chat-messages {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-bubble {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 0.88rem;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .chat-bubble.user {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .chat-bubble.ai {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .chat-input-area {
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-top: 1px solid var(--card-border);
            display: flex;
            gap: 8px;
        }

        .chat-input-area input {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 10px 12px;
            border-radius: 12px;
            color: var(--text-main);
        }

        .send-btn {
            background: var(--accent-gradient);
            color: white;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            cursor: pointer;
        }

        .add-from-ai-btn {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #34d399;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 700;
            margin-top: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        /* Modal Overlays */
        .modal-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center; padding: 20px;
            z-index: 2000; opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-card {
            background: var(--bg-body); border: 1px solid var(--card-border);
            border-radius: 18px; padding: 20px; text-align: center; display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 360px;
        }
        .modal-btn { background: var(--danger); color: white; border: none; padding: 10px; border-radius: 10px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

    <div class="app-frame" id="appFrame">
        <!-- Header -->
        <div class="app-header">
            <div class="app-title">🛒 Smart Cart Pro</div>
            <div class="header-actions">
                <button class="icon-btn" onclick="playClick(); toggleTheme();" title="Toggle Theme">🌓</button>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="nav-tabs">
            <button class="tab-btn active" id="tabCartBtn" onclick="playClick(); switchTab('cart');">📋 My Cart</button>
            <button class="tab-btn" id="tabAiBtn" onclick="playClick(); switchTab('ai');">✨ AI Assistant</button>
        </div>
                <!-- TAB 1: Shopping Cart View -->
        <div class="view-container active" id="cartView">
            <!-- Settings -->
            <div class="settings-bar">
                <div class="select-group">
                    <label>Country</label>
                    <select id="countrySelect" onchange="playClick(); handleCountryChange();">
                        <option value="PK">🇵🇰 Pakistan</option>
                        <option value="IN">🇮🇳 India</option>
                        <option value="US">🇺🇸 USA</option>
                    </select>
                </div>
                <div class="select-group">
                    <label>Currency</label>
                    <select id="currencySelect" onchange="playClick(); render();">
                        <option value="PKR">PKR (Rs)</option>
                        <option value="INR">INR (₹)</option>
                        <option value="USD">USD ($)</option>
                    </select>
                </div>
            </div>

            <!-- Budget Bar & Mood Emoji -->
            <div class="budget-box" id="budgetBox">
                <div class="budget-header">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span style="font-size: 0.85rem; font-weight: 600;">Budget Limit</span>
                        <div id="moodContainer" class="mood-container"></div>
                    </div>
                    <div>
                        <span class="curr-symbol">PKR</span>
                        <input type="number" class="budget-input" id="budgetLimit" value="3000" onchange="render()">
                    </div>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="progressBar"></div>
                </div>
                <div class="budget-row" style="font-size:0.75rem; color:var(--text-sub);">
                    <span id="progressPercent" style="font-weight: 600;">0% Used</span>
                    <span>Spent: <b id="totalSpent" style="color:var(--text-main)">0</b></span>
                </div>
            </div>

            <!-- Manual Input Section -->
            <div class="input-card">
                <input type="text" id="itemName" placeholder="Item Name (e.g. J. Perfume, Samsung Buds...)">
                <div class="row-two">
                    <input type="number" id="itemQty" value="1" min="1" placeholder="Qty" style="flex: 1;">
                    <input type="number" id="itemPrice" placeholder="Price" style="flex: 2;">
                </div>
                <button class="submit-btn" onclick="playClick(); addItem();">+ Add Item Manually</button>
            </div>

            <!-- Shopping List -->
            <div class="list-container" id="listBody"></div>

            <!-- WhatsApp Share Footer -->
            <button class="export-btn" onclick="playClick(); shareToWhatsApp();">
                💬 Share List via WhatsApp
            </button>
        </div>

        <!-- TAB 2: AI Assistant Chatbot View -->
        <div class="view-container" id="aiView">
            <div class="chat-box">
                <div class="chat-messages" id="chatMessages">
                    <div class="chat-bubble ai">
                        👋 Assalam-o-Alaikum! Main aapka AI Shopping Assistant hoon. Mujhse kisi bhi cheez ka latest market rate pooch sakte hain (jaise: <i>"J. Perfume ka kya rate hai?"</i> ya <i>"1kg ghee aur dahi ka price batao"</i>).
                    </div>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="Ask AI for prices or items..." onkeydown="if(event.key==='Enter') sendQueryToGemini()">
                    <button class="send-btn" onclick="playClick(); sendQueryToGemini();">➤</button>
                </div>
            </div>
        </div>

        <!-- Warning Modal -->
        <div class="modal-overlay" id="warningModal">
            <div class="modal-card">
                <div class="modal-title" style="color:var(--danger); font-weight:bold;">🚨 Budget Exceeded!</div>
                <p id="modalMsg" style="font-size:0.85rem; color:var(--text-sub);"></p>
                <button class="modal-btn" onclick="playClick(); closeModal();">OK</button>
            </div>
        </div>
                    </div>
                        <script>
        // Audio Synthesizer Engine
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playClick() {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.04);
                gain.gain.setValueAtTime(0.12, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.04);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.04);
            } catch(e) {}
        }

        function playAlertSound() {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, ctx.currentTime);
                osc.frequency.setValueAtTime(600, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.25);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.25);
            } catch(e) {}
        }

        let shoppingList = JSON.parse(localStorage.getItem("smartCart_aiList")) || [];
        const countryToCurrency = { PK: "PKR", IN: "INR", US: "USD" };

        function handleCountryChange() {
            const country = document.getElementById("countrySelect").value;
            document.getElementById("currencySelect").value = countryToCurrency[country];
            render();
        }

        function switchTab(tab) {
            document.getElementById("cartView").classList.remove("active");
            document.getElementById("aiView").classList.remove("active");
            document.getElementById("tabCartBtn").classList.remove("active");
            document.getElementById("tabAiBtn").classList.remove("active");

            if (tab === 'cart') {
                document.getElementById("cartView").classList.add("active");
                document.getElementById("tabCartBtn").classList.add("active");
            } else {
                document.getElementById("aiView").classList.add("active");
                document.getElementById("tabAiBtn").classList.add("active");
            }
        }

        // Gemini API Configuration
        const GEMINI_API_KEY = "AQ.Ab8RN6Llq0Nql6PgNIjwvWJ0-Bud89XtfaRcwER5OBaPCzciRg";

        async function sendQueryToGemini() {
            const inputEl = document.getElementById("chatInput");
            const query = inputEl.value.trim();
            if (!query) return;

            const chatMessages = document.getElementById("chatMessages");
            
            // Append User Message
            chatMessages.innerHTML += `<div class="chat-bubble user">${query}</div>`;
            inputEl.value = "";
            chatMessages.scrollTop = chatMessages.scrollHeight;

            const country = document.getElementById("countrySelect").value;
            const currency = document.getElementById("currencySelect").value;

            // Loading bubble
            const loadingId = "load_" + Date.now();
            chatMessages.innerHTML += `<div class="chat-bubble ai" id="${loadingId}">AI is thinking & fetching latest rates...</div>`;
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const prompt = `You are a helpful shopping assistant. The user is asking about item rates for country: ${country} in currency: ${currency}. 
                User query: "${query}". 
                Provide estimated current market prices clearly. If the user wants to add an item or asks about prices, format your response naturally, and at the end provide a JSON snippet in this exact format if applicable:
                [ADD_ITEM: {"name": "Item Name", "price": EstimatedNumericPrice}]`;

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    let reply = data.candidates[0].content.parts[0].text;
                    
                    // Check if JSON item is embedded
                    let parsedItem = null;
                    const jsonMatch = reply.match(/\[ADD_ITEM:\s*({.*?})\]/);
                    if (jsonMatch) {
                        try {
                            parsedItem = JSON.parse(jsonMatch[1]);
                            reply = reply.replace(jsonMatch[0], ""); // clean text
                        } catch(e) {}
                    }

                    let bubbleHtml = `<div class="chat-bubble ai">${reply.replace(/\n/g, '<br>')}`;
                    if (parsedItem) {
                        bubbleHtml += `<br><button class="add-from-ai-btn" onclick='addParsedItemFromAI(${JSON.stringify(parsedItem.name)}, ${parsedItem.price})'>➕ Add "${parsedItem.name}" (${currency} ${parsedItem.price}) to Cart</button>`;
                    }
                    bubbleHtml += `</div>`;

                    chatMessages.innerHTML += bubbleHtml;
                } else {
                    chatMessages.innerHTML += `<div class="chat-bubble ai">Sorry, I couldn't fetch the rate right now. Please try again.</div>`;
                }
            } catch (error) {
                document.getElementById(loadingId).remove();
                chatMessages.innerHTML += `<div class="chat-bubble ai">Network error. Please check your connection.</div>`;
            }
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function addParsedItemFromAI(name, price) {
            playClick();
            document.getElementById("itemName").value = name;
            document.getElementById("itemPrice").value = price;
            document.getElementById("itemQty").value = 1;
            switchTab('cart');
            addItem();
        }

        function addItem() {
            const nameEl = document.getElementById("itemName");
            const qtyEl = document.getElementById("itemQty");
            const priceEl = document.getElementById("itemPrice");

            const name = nameEl.value.trim();
            const qty = parseInt(qtyEl.value) || 1;
            const price = parseFloat(priceEl.value) || 0;

            if (!name) return alert("Please enter item name!");

            const currentTotal = shoppingList.reduce((sum, i) => sum + (i.price * i.qty), 0);
            const budgetLimit = parseFloat(document.getElementById("budgetLimit").value) || 0;
            const projectedCost = price * qty;
            const curr = document.getElementById("currencySelect").value;

            if (budgetLimit > 0 && (currentTotal + projectedCost) > budgetLimit) {
                playAlertSound();
                showWarning(`Adding "${name}" (${curr} ${projectedCost}) exceeds your budget limit.`);
                return;
            }

            shoppingList.push({ id: Date.now(), name, qty, price, completed: false });
            nameEl.value = ""; priceEl.value = ""; qtyEl.value = 1;
            saveAndRender();
        }

        function toggleComplete(id) {
            playClick();
            const item = shoppingList.find(i => i.id === id);
            if (item) { item.completed = !item.completed; saveAndRender(); }
        }

        function updateQty(id, delta) {
            playClick();
            const item = shoppingList.find(i => i.id === id);
            if (!item) return;

            if (delta > 0) {
                const currentTotal = shoppingList.reduce((sum, i) => sum + (i.price * i.qty), 0);
                const budgetLimit = parseFloat(document.getElementById("budgetLimit").value) || 0;
                if (budgetLimit > 0 && (currentTotal + item.price) > budgetLimit) {
                    playAlertSound();
                    showWarning("Budget limit reached!");
                    return;
                }
            }
            item.qty = Math.max(1, item.qty + delta);
            saveAndRender();
        }

        function deleteItem(id) {
            playClick();
            shoppingList = shoppingList.filter(i => i.id !== id);
            saveAndRender();
        }

        function shareToWhatsApp() {
            if (shoppingList.length === 0) return alert("Shopping list is empty!");
            const curr = document.getElementById("currencySelect").value;
            let text = `🛒 *Smart Shopping List*\n----------------------------\n`;
            let total = 0;
            shoppingList.forEach((item, index) => {
                const itemTotal = item.price * item.qty;
                total += itemTotal;
                text += `${index + 1}. *${item.name}* (x${item.qty}) - ${curr} ${itemTotal}\n`;
            });
            text += `----------------------------\n💰 *Total:* ${curr} ${total}`;
            window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
        }

        function showWarning(msg) {
            document.getElementById("modalMsg").innerText = msg;
            document.getElementById("warningModal").classList.add("active");
        }

        function closeModal() {
            document.getElementById("warningModal").classList.remove("active");
        }

        function saveAndRender() {
            localStorage.setItem("smartCart_aiList", JSON.stringify(shoppingList));
            render();
        }

        function render() {
            const listBody = document.getElementById("listBody");
            const selectedCurrency = document.getElementById("currencySelect").value;
            document.querySelectorAll(".curr-symbol").forEach(el => el.innerText = selectedCurrency);

            listBody.innerHTML = "";
            if (shoppingList.length === 0) {
                listBody.innerHTML = `<div style="text-align:center; color: var(--text-sub); padding: 2rem; font-size:0.85rem;">No items in cart yet.<br>Ask AI assistant or add manually!</div>`;
            }

            shoppingList.forEach((item) => {
                const itemEl = document.createElement("div");
                itemEl.className = "list-item";
                itemEl.innerHTML = `
                    <input type="checkbox" ${item.completed ? 'checked' : ''} onclick="toggleComplete(${item.id})">
                    <div class="item-info">
                        <span class="item-name ${item.completed ? 'completed-text' : ''}">${item.name}</span>
                        <span style="font-size:0.75rem; color:var(--text-sub);">${selectedCurrency} ${item.price * item.qty}</span>
                    </div>
                    <div class="qty-picker">
                        <button class="qty-btn" onclick="updateQty(${item.id}, -1)">-</button>
                        <span style="font-size:0.85rem">${item.qty}</span>
                        <button class="qty-btn" onclick="updateQty(${item.id}, 1)">+</button>
                    </div>
                    <button class="qty-btn" style="color:var(--danger);" onclick="deleteItem(${item.id})">✕</button>
                `;
                listBody.appendChild(itemEl);
            });

            const total = shoppingList.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const budgetLimit = parseFloat(document.getElementById("budgetLimit").value) || 0;
            document.getElementById("totalSpent").innerText = `${selectedCurrency} ${total}`;

            const percent = budgetLimit > 0 ? Math.min(100, Math.round((total / budgetLimit) * 100)) : 0;
            const bar = document.getElementById("progressBar");
            const moodBox = document.getElementById("moodContainer");
            const budgetBox = document.getElementById("budgetBox");

            bar.style.width = `${percent}%`;
            document.getElementById("progressPercent").innerText = `${percent}% Used`;

            if (percent < 30) {
                bar.style.backgroundColor = "#10b981";
                budgetBox.style.boxShadow = "0 10px 30px rgba(16, 185, 129, 0.15)";
                moodBox.innerHTML = `<span class="anim-emoji happy-bounce">😊</span>`;
            } else if (percent < 60) {
                bar.style.backgroundColor = "#facc15";
                budgetBox.style.boxShadow = "0 10px 30px rgba(250, 204, 21, 0.15)";
                moodBox.innerHTML = `<span class="anim-emoji sad-wiggle">😟</span>`;
            } else if (percent < 80) {
                bar.style.backgroundColor = "#f97316";
                budgetBox.style.boxShadow = "0 10px 30px rgba(249, 115, 22, 0.2)";
                moodBox.innerHTML = `<span class="anim-emoji full-sad-droop">😢</span>`;
            } else {
                bar.style.backgroundColor = "#ef4444";
                budgetBox.style.boxShadow = "0 10px 30px rgba(239, 68, 68, 0.35)";
                moodBox.innerHTML = `<span class="anim-emoji angry-shake">😡</span>`;
            }
        }

        function toggleTheme() {
            document.body.classList.toggle("light-mode");
        }

        render();
    </script>
</body>
</html>
