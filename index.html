<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Cart Pro - AI Assistant</title>
    <style>
        :root {
            --bg-body: #05070b;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-gradient: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
            --glow-color: rgba(99, 102, 241, 0.15);
            --danger: #ef4444;
            --success: #10b981;
        }

        .light-mode {
            --bg-body: #f1f5f9;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(0, 0, 0, 0.08);
            --text-main: #0f172a;
            --text-sub: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            overflow: hidden;
            transition: background-color 0.3s ease;
        }

        .app-frame {
            width: 100%;
            max-width: 420px;
            height: 100dvh;
            max-height: 900px;
            background: var(--bg-body);
            background-image: radial-gradient(circle at top right, rgba(99, 102, 241, 0.12), transparent 40%),
                              radial-gradient(circle at bottom left, rgba(236, 72, 153, 0.08), transparent 40%);
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 12px;
            position: relative;
            overflow: hidden;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 2px;
        }

        .app-title {
            font-size: 1.4rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }
        .icon-btn:active { transform: scale(0.92); }

        .nav-tabs {
            display: flex;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 4px;
            gap: 4px;
            backdrop-filter: blur(12px);
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-sub);
            padding: 8px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: var(--accent-gradient);
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .view-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow: hidden;
            display: none;
        }

        .view-container.active {
            display: flex;
        }

        .budget-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 10px 30px var(--glow-color);
            backdrop-filter: blur(16px);
            transition: all 0.4s ease;
        }

        .budget-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .mood-container {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .anim-emoji { font-size: 1.6rem; display: inline-block; }
        .happy-bounce { animation: bounce 1.2s infinite ease-in-out; }
        .sad-wiggle { animation: wiggle 2s infinite ease-in-out; }
        .full-sad-droop { animation: pulse 1.5s infinite ease-in-out; }
        .angry-shake { animation: shakeAngry 0.3s infinite ease-in-out; }

        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px) scale(1.1); } }
        @keyframes wiggle { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(0.92); opacity: 1; } }
        @keyframes shakeAngry { 
            0% { transform: translate(0, 0) rotate(0deg); } 
            25% { transform: translate(-2px, 1px) rotate(-3deg); }
            50% { transform: translate(2px, -1px) rotate(3deg); }
            75% { transform: translate(-1px, -1px) rotate(-2deg); }
            100% { transform: translate(1px, 2px) rotate(2deg); }
        }

        .budget-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
        .budget-input { width: 110px; text-align: center; padding: 6px; font-weight: 700; border-radius: 10px; }

        .progress-track {
            width: 100%; height: 10px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px; overflow: hidden;
        }

        .progress-fill {
            height: 100%; width: 0%;
            background: var(--success);
            transition: width 0.4s ease, background-color 0.3s ease;
            border-radius: 10px;
        }

        .settings-bar {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 10px;
            display: flex;
            gap: 8px;
            backdrop-filter: blur(12px);
        }

        .select-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .select-group label {
            font-size: 0.65rem;
            color: var(--text-sub);
            text-transform: uppercase;
            font-weight: 700;
        }

        select, input {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 8px 10px;
            border-radius: 10px;
            outline: none;
            font-size: 0.88rem;
            width: 100%;
        }

        .input-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            backdrop-filter: blur(12px);
        }

        .row-two { display: flex; gap: 8px; }

        .submit-btn {
            background: var(--accent-gradient); color: white; border: none;
            padding: 11px; border-radius: 12px; font-weight: 700; cursor: pointer; width: 100%;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            transition: transform 0.2s ease;
        }
        .submit-btn:active { transform: scale(0.96); }

        .list-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-bottom: 4px; }

        .list-item {
            background: var(--card-bg); border: 1px solid var(--card-border);
            padding: 12px; border-radius: 14px; display: flex; align-items: center; gap: 10px;
            backdrop-filter: blur(12px);
        }

        .item-info { flex: 1; display: flex; flex-direction: column; gap: 2px; }
        .item-name { font-size: 0.9rem; font-weight: 600; }
        .completed-text { text-decoration: line-through; opacity: 0.4; }

        .qty-picker {
            display: flex; align-items: center; gap: 6px;
            background: rgba(0, 0, 0, 0.25); padding: 4px 8px; border-radius: 10px;
        }

        .qty-btn { background: transparent; border: none; color: var(--text-main); width: 22px; height: 22px; cursor: pointer; font-weight: bold; }

        .export-btn {
            background: linear-gradient(135deg, #10b981, #059669); color: white;
            border: none; padding: 12px; border-radius: 14px; font-weight: 700;
            display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .chat-box {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(16px);
        }

        .chat-messages {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-bubble {
            max-width: 88%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 0.88rem;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .chat-bubble.user {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .chat-bubble.ai {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .suggestion-chips-wrapper {
            display: flex;
            gap: 6px;
            padding: 8px 10px;
            overflow-x: auto;
            background: rgba(0,0,0,0.15);
            border-top: 1px solid var(--card-border);
            white-space: nowrap;
        }

        .chip-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.76rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .chip-btn:hover { background: var(--accent-gradient); color: white; }

        .chat-input-area {
            padding: 10px;
            background: rgba(0, 0, 0, 0.25);
            border-top: 1px solid var(--card-border);
            display: flex;
            gap: 8px;
        }

        .chat-input-area input {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 10px 12px;
            border-radius: 12px;
            color: var(--text-main);
        }

        .send-btn {
            background: var(--accent-gradient);
            color: white;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            cursor: pointer;
        }

        .add-from-ai-btn {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #34d399;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 700;
            margin-top: 8px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .modal-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center; padding: 20px;
            z-index: 2000; opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-card {
            background: var(--bg-body); border: 1px solid var(--card-border);
            border-radius: 18px; padding: 20px; text-align: center; display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 360px;
        }
        .modal-btn { background: var(--danger); color: white; border: none; padding: 10px; border-radius: 10px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

    <div class="app-frame" id="appFrame">
        <!-- Header -->
        <div class="app-header">
            <div class="app-title">🛒 Smart Cart Pro</div>
            <div class="header-actions">
                <button class="icon-btn" onclick="playClick(); toggleTheme();" title="Toggle Theme">🌓</button>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="nav-tabs">
            <button class="tab-btn active" id="tabCartBtn" onclick="playClick(); switchTab('cart');">📋 My Cart</button>
            <button class="tab-btn" id="tabAiBtn" onclick="playClick(); switchTab('ai');">✨ AI Assistant</button>
        </div>

        <!-- TAB 1: Shopping Cart View -->
        <div class="view-container active" id="cartView">
            <!-- Country & Currency Settings -->
            <div class="settings-bar">
                <div class="select-group">
                    <label>Country</label>
                    <select id="countrySelect" onchange="playClick(); handleCountryChange();">
                        <option value="PK">🇵🇰 Pakistan</option>
                        <option value="IN">🇮🇳 India</option>
                        <option value="US">🇺🇸 USA</option>
                    </select>
                </div>
                <div class="select-group">
                    <label>Currency</label>
                    <select id="currencySelect" onchange="playClick(); render();">
                        <option value="PKR">PKR (Rs)</option>
                        <option value="INR">INR (₹)</option>
                        <option value="USD">USD ($)</option>
                    </select>
                </div>
            </div>

            <!-- Budget Bar & Mood Emoji -->
            <div class="budget-box" id="budgetBox">
                <div class="budget-header">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span style="font-size: 0.85rem; font-weight: 600;">Budget Limit</span>
                        <div id="moodContainer" class="mood-container"></div>
                    </div>
                    <div>
                        <span class="curr-symbol">PKR</span>
                        <input type="number" class="budget-input" id="budgetLimit" value="3000" onchange="render()">
                    </div>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="progressBar"></div>
                </div>
                <div class="budget-row" style="font-size:0.75rem; color:var(--text-sub);">
                    <span id="progressPercent" style="font-weight: 600;">0% Used</span>
                    <span>Spent: <b id="totalSpent" style="color:var(--text-main)">0</b></span>
                </div>
            </div>

            <!-- Manual Input Section -->
            <div class="input-card">
                <input type="text" id="itemName" placeholder="Item Name (e.g. Perfume, Eggs, Milk...)">
                <div class="row-two">
                    <input type="number" id="itemQty" value="1" min="1" placeholder="Qty" style="flex: 1;">
                    <input type="number" id="itemPrice" placeholder="Price" style="flex: 2;">
                </div>
                <button class="submit-btn" onclick="playClick(); addItem();">+ Add Item Manually</button>
            </div>

            <!-- Shopping List -->
            <div class="list-container" id="listBody"></div>

            <!-- WhatsApp Share Footer -->
            <button class="export-btn" onclick="playClick(); shareToWhatsApp();">
                💬 Share List via WhatsApp
            </button>
        </div>

        <!-- TAB 2: AI Assistant Chatbot View -->
        <div class="view-container" id="aiView">
            <div class="chat-box">
                <div class="chat-messages" id="chatMessages">
                    <div class="chat-bubble ai">
                        👋 Assalam-o-Alaikum! Main aapka AI Assistant hoon. Kisi bhi cheez ka rate poochiye (jaise: <i>"Perfume ka rate"</i> ya <i>"1 dozen eggs"</i>) ya neeche suggestion tap karein.
                    </div>
                </div>
                
                <!-- Dynamic Auto-Learning Suggestions Chips Bar -->
                <div class="suggestion-chips-wrapper" id="suggestionChipsContainer"></div>

                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="Ask AI for prices or items..." onkeydown="if(event.key==='Enter') sendQueryToGemini()">
                    <button class="send-btn" onclick="playClick(); sendQueryToGemini();">➤</button>
                </div>
            </div>
        </div>

        <!-- Warning Modal -->
        <div class="modal-overlay" id="warningModal">
            <div class="modal-card">
                <div class="modal-title" style="color:var(--danger); font-weight:bold;">🚨 Budget Exceeded!</div>
                <p id="modalMsg" style="font-size:0.85rem; color:var(--text-sub);"></p>
                <button class="modal-btn" onclick="playClick(); closeModal();">OK</button>
            </div>
        </div>
    </div>
        <script>
        // Updated API Key
        const GEMINI_API_KEY = "AQ.Ab8RN6KvudD3M6f1kV9f-jEJbBRRw-fcwMUge0AJmRZyUK6wsw";
        const GEMINI_API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`;

        let state = {
            country: 'PK',
            currency: 'PKR',
            budget: 3000,
            items: [],
            theme: 'dark',
            learnedItems: ['Perfume', 'Milk 1L', 'Eggs 1 Dozen', 'Bread', 'Chicken 1kg', 'Rice 1kg', 'Cooking Oil 1L']
        };

        const currSymbols = { PKR: 'Rs', INR: '₹', USD: '$' };

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playClick() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        function switchTab(tab) {
            document.getElementById('cartView').classList.toggle('active', tab === 'cart');
            document.getElementById('aiView').classList.toggle('active', tab === 'ai');
            document.getElementById('tabCartBtn').classList.toggle('active', tab === 'cart');
            document.getElementById('tabAiBtn').classList.toggle('active', tab === 'ai');
            renderChips();
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            state.theme = document.body.classList.contains('light-mode') ? 'light' : 'dark';
        }

        function handleCountryChange() {
            const country = document.getElementById('countrySelect').value;
            state.country = country;
            const currencySelect = document.getElementById('currencySelect');
            if (country === 'PK') currencySelect.value = 'PKR';
            else if (country === 'IN') currencySelect.value = 'INR';
            else if (country === 'US') currencySelect.value = 'USD';
            render();
        }

        function addItem(name = null, price = null, qty = 1) {
            const nameInput = document.getElementById('itemName');
            const priceInput = document.getElementById('itemPrice');
            const qtyInput = document.getElementById('itemQty');

            const finalName = name || nameInput.value.trim();
            const finalPrice = price !== null ? parseFloat(price) : parseFloat(priceInput.value);
            const finalQty = qty || parseInt(qtyInput.value) || 1;

            if (!finalName || isNaN(finalPrice) || finalPrice <= 0) {
                alert('Please enter valid item name and price!');
                return;
            }

            // Case-insensitive duplicate check & insert at top
            const exists = state.learnedItems.some(i => i.toLowerCase() === finalName.toLowerCase());
            if (!exists) {
                state.learnedItems.unshift(finalName);
            }

            state.items.push({
                id: Date.now(),
                name: finalName,
                price: finalPrice,
                qty: finalQty,
                completed: false
            });

            if (!name) {
                nameInput.value = '';
                priceInput.value = '';
                qtyInput.value = '1';
            }

            render();
            renderChips(); // Dynamic Chip Learning Fix
        }

        function toggleComplete(id) {
            const item = state.items.find(i => i.id === id);
            if (item) item.completed = !item.completed;
            render();
        }

        function updateQty(id, delta) {
            const item = state.items.find(i => i.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) state.items = state.items.filter(i => i.id !== id);
            }
            render();
        }

        function deleteItem(id) {
            state.items = state.items.filter(i => i.id !== id);
            render();
        }

        function render() {
            const curr = document.getElementById('currencySelect').value;
            state.currency = curr;
            document.querySelectorAll('.curr-symbol').forEach(el => el.textContent = currSymbols[curr] || curr);

            const budget = parseFloat(document.getElementById('budgetLimit').value) || 0;
            state.budget = budget;

            const totalSpent = state.items.reduce((sum, item) => sum + (item.price * item.qty), 0);
            document.getElementById('totalSpent').textContent = `${totalSpent.toFixed(0)} ${currSymbols[curr]}`;

            const percent = budget > 0 ? Math.min((totalSpent / budget) * 100, 100) : 0;
            const bar = document.getElementById('progressBar');
            bar.style.width = `${percent}%`;

            const percentText = document.getElementById('progressPercent');
            percentText.textContent = `${percent.toFixed(0)}% Used`;

            const mood = document.getElementById('moodContainer');
            if (totalSpent === 0) {
                mood.innerHTML = '<span class="anim-emoji happy-bounce">😊</span>';
                bar.style.backgroundColor = 'var(--success)';
            } else if (totalSpent <= budget * 0.75) {
                mood.innerHTML = '<span class="anim-emoji happy-bounce">🙂</span>';
                bar.style.backgroundColor = 'var(--success)';
            } else if (totalSpent <= budget) {
                mood.innerHTML = '<span class="anim-emoji sad-wiggle">😟</span>';
                bar.style.backgroundColor = '#f59e0b';
            } else if (totalSpent <= budget * 1.25) {
                mood.innerHTML = '<span class="anim-emoji full-sad-droop">😭</span>';
                bar.style.backgroundColor = 'var(--danger)';
            } else {
                mood.innerHTML = '<span class="anim-emoji angry-shake">😡</span>';
                bar.style.backgroundColor = '#b91c1c';
                showModal(`Budget Limit (${budget} ${curr}) Overstepped by ${(totalSpent - budget).toFixed(0)} ${curr}!`);
            }

            const listBody = document.getElementById('listBody');
            listBody.innerHTML = '';

            state.items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'list-item';
                card.innerHTML = `
                    <input type="checkbox" ${item.completed ? 'checked' : ''} onchange="playClick(); toggleComplete(${item.id})">
                    <div class="item-info">
                        <span class="item-name ${item.completed ? 'completed-text' : ''}">${item.name}</span>
                        <span style="font-size:0.75rem; color:var(--text-sub);">${item.price} ${currSymbols[curr]} x ${item.qty} = <b>${(item.price * item.qty).toFixed(0)} ${currSymbols[curr]}</b></span>
                    </div>
                    <div class="qty-picker">
                        <button class="qty-btn" onclick="playClick(); updateQty(${item.id}, -1)">-</button>
                        <span style="font-size:0.85rem; font-weight:bold;">${item.qty}</span>
                        <button class="qty-btn" onclick="playClick(); updateQty(${item.id}, 1)">+</button>
                    </div>
                    <button style="background:transparent; border:none; color:var(--danger); cursor:pointer; font-size:1.1rem;" onclick="playClick(); deleteItem(${item.id})">🗑️</button>
                `;
                listBody.appendChild(card);
            });
        }

        function shareToWhatsApp() {
            if (state.items.length === 0) {
                alert("Your cart is empty!");
                return;
            }
            let msg = `🛒 *Smart Cart Shopping List*\n\n`;
            let total = 0;
            state.items.forEach((item, index) => {
                const sub = item.price * item.qty;
                total += sub;
                msg += `${index + 1}. ${item.name} - ${item.qty}x @ ${item.price} = *${sub} ${state.currency}*\n`;
            });
            msg += `\n💰 *Total Estimated Spent:* ${total} ${state.currency}`;
            msg += `\n📌 *Budget Limit:* ${state.budget} ${state.currency}`;
            
            const url = `https://wa.me/?text=${encodeURIComponent(msg)}`;
            window.open(url, '_blank');
        }

        function renderChips() {
            const container = document.getElementById('suggestionChipsContainer');
            if (!container) return;
            container.innerHTML = '';
            state.learnedItems.slice(0, 10).forEach(item => {
                const chip = document.createElement('button');
                chip.className = 'chip-btn';
                chip.textContent = `💡 Price of ${item}?`;
                chip.onclick = () => {
                    playClick();
                    document.getElementById('chatInput').value = `${item} ka rate kya hai?`;
                    sendQueryToGemini();
                };
                container.appendChild(chip);
            });
        }

        async function sendQueryToGemini() {
            const input = document.getElementById('chatInput');
            const userMsg = input.value.trim();
            if (!userMsg) return;

            const chatMessages = document.getElementById('chatMessages');
            
            const userBubble = document.createElement('div');
            userBubble.className = 'chat-bubble user';
            userBubble.textContent = userMsg;
            chatMessages.appendChild(userBubble);
            input.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            const aiBubble = document.createElement('div');
            aiBubble.className = 'chat-bubble ai';
            aiBubble.textContent = '⚡ Checking estimated prices...';
            chatMessages.appendChild(aiBubble);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const prompt = `You are a helpful AI Smart Shopping Assistant for ${state.country} region. 
                User query: "${userMsg}".
                Task:
                1. Provide a direct, helpful estimate for the requested product/price in ${state.currency}.
                2. Keep the answer concise in natural Roman Urdu or English.
                3. ALWAYS end with a strict JSON snippet formatted like this:
                @@JSON{"name": "Item Name", "price": 250, "qty": 1}@@`;

                const response = await fetch(GEMINI_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    aiBubble.textContent = `❌ API Error: ${data.error.message}`;
                    return;
                }

                let reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Response nahi mila. Key check karein.";

                let parsedItem = null;
                const jsonMatch = reply.match(/@@JSON({.*?})@@/s);
                if (jsonMatch) {
                    try {
                        parsedItem = JSON.parse(jsonMatch[1]);
                        reply = reply.replace(/@@JSON{.*?}@@/s, '').trim();
                    } catch (e) {}
                }

                aiBubble.innerHTML = reply.replace(/\n/g, '<br>');

                if (parsedItem) {
                    const addBtn = document.createElement('button');
                    addBtn.className = 'add-from-ai-btn';
                    addBtn.innerHTML = `➕ Add ${parsedItem.name} (${parsedItem.price} ${state.currency}) to Cart`;
                    addBtn.onclick = () => {
                        playClick();
                        addItem(parsedItem.name, parsedItem.price, parsedItem.qty || 1);
                        switchTab('cart');
                    };
                    aiBubble.appendChild(document.createElement('br'));
                    aiBubble.appendChild(addBtn);
                }

            } catch (err) {
                aiBubble.textContent = '❌ Fetch Error: Connection loss ya invalid API Key.';
            }
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showModal(msg) {
            document.getElementById('modalMsg').textContent = msg;
            document.getElementById('warningModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('warningModal').classList.remove('active');
        }

        render();
        renderChips();
    </script>
</body>
</html>
