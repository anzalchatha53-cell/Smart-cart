<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Cart AI - Live Google Search</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Orbitron:wght@700;900&display=swap');

        :root {
            --bg-body: #030712;
            --card-bg: rgba(17, 24, 39, 0.65);
            --card-border: rgba(99, 102, 241, 0.35);
            --input-bg: rgba(31, 41, 55, 0.7);
            --text-main: #f9fafb;
            --text-sub: #9ca3af;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%);
            --primary-glow: 0 0 25px rgba(139, 92, 246, 0.5);
            --neon-border-glow: 0 0 15px rgba(139, 92, 246, 0.35);
            --success: #10b981;
            --danger: #ef4444;
            --cyber-cyan: #06b6d4;
        }

        .light-mode {
            --bg-body: #e0e7ff;
            --card-bg: rgba(255, 255, 255, 0.75);
            --card-border: rgba(99, 102, 241, 0.4);
            --input-bg: rgba(243, 244, 246, 0.95);
            --text-main: #0f172a;
            --text-sub: #475569;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-body);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.3), transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(217, 70, 239, 0.25), transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(6, 182, 212, 0.15), transparent 60%);
            color: var(--text-main);
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100dvh;
            background: rgba(3, 7, 18, 0.82);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-left: 1px solid var(--card-border);
            border-right: 1px solid var(--card-border);
            position: relative;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
        }

        .header {
            padding: 16px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.25rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 40%, #e879f9 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
            animation: neonGlow 2.5s infinite alternate ease-in-out;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        @keyframes neonGlow {
            0% { filter: drop-shadow(0 0 6px rgba(99, 102, 241, 0.6)) drop-shadow(0 0 12px rgba(139, 92, 246, 0.4)); }
            100% { filter: drop-shadow(0 0 12px rgba(168, 85, 247, 0.9)) drop-shadow(0 0 25px rgba(217, 70, 239, 0.8)); }
        }

        .controls { display: flex; gap: 6px; }

        select, button {
            background: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 6px 10px;
            border-radius: 10px;
            font-size: 0.8rem;
            outline: none;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        select:focus, button:active { transform: scale(0.95); }

        .tab-bar {
            display: flex;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            padding: 6px;
            margin: 12px 12px 0;
            border-radius: 16px;
            border: 1px solid var(--card-border);
            box-shadow: var(--neon-border-glow);
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: var(--text-sub);
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .tab-btn.active {
            background: var(--primary-gradient);
            color: #ffffff;
            box-shadow: var(--primary-glow);
        }

        .view-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            padding-bottom: 85px;
            display: none;
            flex-direction: column;
            animation: viewFadeIn 0.35s ease-out;
        }

        @keyframes viewFadeIn {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .view-content.active { display: flex; }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            transition: border-color 0.3s, box-shadow 0.3s, transform 0.2s;
        }

        .glass-card:hover {
            border-color: rgba(168, 85, 247, 0.6);
            box-shadow: var(--neon-border-glow);
        }

        .budget-header { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 8px; font-weight: 700; }

        .progress-bar-bg {
            height: 12px;
            background: var(--input-bg);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
            border: 1px solid var(--card-border);
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #06b6d4, #10b981, #a855f7, #d946ef);
            background-size: 200% 100%;
            border-radius: 10px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.7);
            animation: gradientShift 3s infinite linear;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .add-item-form {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-row-equal {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
        }

        input[type="text"], input[type="number"] {
            background: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 12px 14px;
            border-radius: 14px;
            font-size: 0.85rem;
            outline: none;
            transition: all 0.25s ease;
            width: 100%;
        }

        input[type="text"]:focus, input[type="number"]:focus {
            border-color: #d946ef;
            box-shadow: 0 0 15px rgba(217, 70, 239, 0.4);
            transform: translateY(-1px);
        }

        .actions-row { display: flex; gap: 8px; align-items: center; }

        .btn-add {
            flex: 1;
            background: var(--primary-gradient);
            color: white;
            border: none;
            font-weight: 800;
            padding: 12px;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: var(--primary-glow);
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        .btn-add:hover { transform: translateY(-2px); filter: brightness(1.2); }
        .btn-add:active { transform: translateY(1px) scale(0.98); }

        .icon-btn {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            padding: 11px 13px;
            border-radius: 14px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .icon-btn:hover { border-color: #a855f7; box-shadow: 0 0 12px rgba(168, 85, 247, 0.35); }

        .suggestions-dropdown {
            position: absolute;
            top: 55px; left: 0; right: 0;
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid #d946ef;
            border-radius: 16px;
            max-height: 180px;
            overflow-y: auto;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: none;
            animation: dropdownSlide 0.2s ease;
        }

        @keyframes dropdownSlide {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .suggestion-item {
            padding: 12px 16px;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--card-border);
            transition: background 0.2s;
        }

        .suggestion-item:hover { background: rgba(217, 70, 239, 0.2); }

        .list-container { flex: 1; display: flex; flex-direction: column; gap: 10px; }

        .list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            padding: 14px 16px;
            border-radius: 16px;
            gap: 10px;
            animation: itemPop 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            transition: all 0.25s ease;
        }

        .list-item:hover {
            border-color: rgba(217, 70, 239, 0.6);
            transform: translateY(-2px);
            box-shadow: var(--neon-border-glow);
        }

        @keyframes itemPop {
            from { opacity: 0; transform: translateY(12px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .item-info { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .item-name { font-weight: 700; font-size: 0.92rem; }
        .completed-text { text-decoration: line-through; color: var(--text-sub); opacity: 0.5; }

        .qty-picker { display: flex; align-items: center; gap: 8px; }
        .qty-btn {
            width: 30px; height: 30px; border-radius: 10px; border: 1px solid var(--card-border);
            background: var(--input-bg); color: var(--text-main); font-weight: bold; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.15s ease;
        }
        .qty-btn:active { transform: scale(0.9); }

        .chat-container { flex: 1; display: flex; flex-direction: column; gap: 10px; height: 100%; }
        .chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-right: 2px; }

        .chat-bubble { 
            max-width: 88%; 
            padding: 14px 18px; 
            border-radius: 18px; 
            font-size: 0.88rem; 
            line-height: 1.5; 
            animation: bubblePop 0.25s ease;
        }

        @keyframes bubblePop {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }

        .chat-bubble.user { 
            align-self: flex-end; 
            background: var(--primary-gradient); 
            color: white; 
            border-bottom-right-radius: 4px; 
            box-shadow: var(--primary-glow); 
        }

        .chat-bubble.ai { 
            align-self: flex-start; 
            background: var(--card-bg); 
            color: var(--text-main); 
            border-bottom-left-radius: 4px; 
            border: 1px solid var(--card-border); 
            backdrop-filter: blur(16px); 
        }

        .suggestion-chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; }
        .chip-btn { 
            white-space: nowrap; 
            background: var(--card-bg); 
            border: 1px solid var(--card-border); 
            font-size: 0.78rem; 
            padding: 7px 14px; 
            border-radius: 18px; 
            cursor: pointer; 
            transition: all 0.2s;
            color: var(--text-main);
        }
        .chip-btn:hover { border-color: #d946ef; transform: translateY(-1px); box-shadow: 0 0 10px rgba(217, 70, 239, 0.3); }

        .chat-input-area { display: flex; gap: 8px; }
        .chat-input-area input { flex: 1; }

        .whatsapp-fixed-wrapper {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 14px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--card-border);
            z-index: 10;
        }

        .whatsapp-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white; border: none; font-weight: 800;
            padding: 13px; border-radius: 14px; width: 100%; cursor: pointer;
            display: flex; justify-content: center; align-items: center; gap: 8px;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
            transition: transform 0.15s ease, filter 0.2s;
            font-size: 0.9rem;
        }

        .whatsapp-btn:hover { filter: brightness(1.1); }
        .whatsapp-btn:active { transform: scale(0.98); }

        .add-from-ai-btn {
            background: var(--success); color: white; border: none;
            padding: 9px 14px; border-radius: 10px; margin-top: 10px; font-size: 0.82rem; cursor: pointer;
            box-shadow: 0 2px 12px rgba(16, 185, 129, 0.4); font-weight: 700;
            transition: transform 0.2s;
        }
        .add-from-ai-btn:hover { transform: translateY(-1px); }

        #scannerArea { display: none; margin-bottom: 12px; border-radius: 16px; overflow: hidden; border: 1px solid #d946ef; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <h1>🛸 Smart Cart AI</h1>
            <div class="controls">
                <select id="countrySelect" onchange="handleCountryChange()">
                    <option value="PK">🇵🇰 PK</option>
                    <option value="IN">🇮🇳 IN</option>
                    <option value="US">🇺🇸 US</option>
                </select>
                <select id="currencySelect" onchange="render()">
                    <option value="PKR">PKR</option>
                    <option value="INR">INR</option>
                    <option value="USD">USD</option>
                </select>
                <button onclick="toggleTheme()">🌗</button>
            </div>
        </div>

        <div class="tab-bar">
            <button class="tab-btn active" id="tabCartBtn" onclick="switchTab('cart')">🛒 Cart</button>
            <button class="tab-btn" id="tabAiBtn" onclick="switchTab('ai')">🤖 AI Assistant</button>
        </div>

        <div class="view-content active" id="cartView">
            <div class="glass-card">
                <div class="budget-header">
                    <span>⚡ Budget Tracker</span>
                    <span id="moodContainer">😊</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progressBar"></div>
                </div>
                <div style="display:flex; justify-content:space-between; font-size:0.8rem; color:var(--text-sub);">
                    <span>Spent: <b id="totalSpent" style="color:var(--text-main)">0 PKR</b></span>
                    <span id="progressPercent">0% Used</span>
                </div>
                <div style="margin-top:10px; display:flex; align-items:center; gap:8px;">
                    <label style="font-size:0.8rem; color:var(--text-sub)">Limit:</label>
                    <input type="number" id="budgetLimit" value="50000" style="padding:6px 10px; font-size:0.8rem; flex:1;" onchange="saveState(); render();">
                </div>
            </div>

            <div id="scannerArea">
                <div id="reader" style="width: 100%;"></div>
                <button onclick="stopBarcodeScanner()" style="width: 100%; background: var(--danger); border:none; padding: 10px; color: white; font-weight:700;">Close Scanner</button>
            </div>

            <div class="glass-card add-item-form">
                <input type="text" id="itemName" placeholder="📦 Item Name (e.g. Core i5 processor)" autocomplete="off" oninput="handleItemTyping(this.value)">
                
                <div class="input-row-equal">
                    <input type="number" id="itemPrice" placeholder="💰 Price">
                    <input type="number" id="itemQty" value="1" placeholder="🔢 Qty">
                </div>

                <div class="actions-row">
                    <button class="icon-btn" onclick="startVoiceInput()" title="Voice Input">🎙️</button>
                    <button class="icon-btn" onclick="startBarcodeScanner()" title="Scan Barcode">📷</button>
                    <button class="btn-add" onclick="addItem()">⚡ Add Item</button>
                </div>

                <div class="suggestions-dropdown" id="suggestionsDropdown"></div>
            </div>

            <div class="list-container" id="listBody"></div>

            <div class="whatsapp-fixed-wrapper">
                <button class="whatsapp-btn" onclick="shareToWhatsApp()">📲 Share List on WhatsApp</button>
            </div>
        </div>

        <div class="view-content" id="aiView" style="padding-bottom: 12px;">
            <div class="chat-container">
                <div class="chat-messages" id="chatMessages">
                    <div class="chat-bubble ai">
                        Salam! Google Search Live API integrated hai. Kisi bhi item ka live rate poochen! 🌐
                    </div>
                </div>

                <div class="suggestion-chips" id="suggestionChipsContainer"></div>

                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="Ask e.g. core i5 processor rate" onkeypress="if(event.key==='Enter') fetchGoogleSearchRate()">
                    <button class="icon-btn" onclick="startVoiceInputForAI()">🎙️</button>
                    <button class="btn-add" onclick="fetchGoogleSearchRate()">Search</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SEARCH_API_KEY = "860f1d80-90e0-11f1-b7a6-0b37020f7f0c";
        let html5QrcodeScanner = null;

        let state = {
            country: 'PK',
            currency: 'PKR',
            budget: JSON.parse(localStorage.getItem('CART_BUDGET')) || 50000,
            items: JSON.parse(localStorage.getItem('CART_ITEMS')) || [],
            learnedItems: JSON.parse(localStorage.getItem('LEARNED_ITEMS')) || []
        };

        document.getElementById('budgetLimit').value = state.budget;

        function saveState() {
            localStorage.setItem('CART_ITEMS', JSON.stringify(state.items));
            localStorage.setItem('LEARNED_ITEMS', JSON.stringify(state.learnedItems));
            localStorage.setItem('CART_BUDGET', JSON.stringify(parseFloat(document.getElementById('budgetLimit').value) || 0));
        }

        function switchTab(tab) {
            document.getElementById('cartView').classList.toggle('active', tab === 'cart');
            document.getElementById('aiView').classList.toggle('active', tab === 'ai');
            document.getElementById('tabCartBtn').classList.toggle('active', tab === 'cart');
            document.getElementById('tabAiBtn').classList.toggle('active', tab === 'ai');
            renderChips();
        }

        function toggleTheme() { document.body.classList.toggle('light-mode'); }

        function handleCountryChange() {
            const country = document.getElementById('countrySelect').value;
            state.country = country;
            const currencySelect = document.getElementById('currencySelect');
            if (country === 'PK') currencySelect.value = 'PKR';
            else if (country === 'IN') currencySelect.value = 'INR';
            else if (country === 'US') currencySelect.value = 'USD';
            render();
        }

        function handleItemTyping(val) {
            const dropdown = document.getElementById('suggestionsDropdown');
            if (!val.trim()) { dropdown.style.display = 'none'; return; }

            const matches = state.learnedItems.filter(item => 
                item.name.toLowerCase().includes(val.toLowerCase())
            );

            if (matches.length === 0) { dropdown.style.display = 'none'; return; }

            dropdown.innerHTML = '';
            matches.forEach(item => {
                const div = document.createElement('div');
                div.className = 'suggestion-item';
                div.innerHTML = `<span>✨ ${item.name}</span> <b>${item.price} ${state.currency}</b>`;
                div.onclick = () => {
                    document.getElementById('itemName').value = item.name;
                    document.getElementById('itemPrice').value = item.price;
                    dropdown.style.display = 'none';
                };
                dropdown.appendChild(div);
            });
            dropdown.style.display = 'block';
        }

        function saveToSuggestions(name, price) {
            const index = state.learnedItems.findIndex(i => i.name.toLowerCase() === name.toLowerCase());
            if (index !== -1) {
                state.learnedItems[index].price = price;
            } else {
                state.learnedItems.unshift({ name, price });
            }
            saveState();
        }

        function addItem(name = null, price = null, qty = 1) {
            const nameInput = document.getElementById('itemName');
            const priceInput = document.getElementById('itemPrice');
            const qtyInput = document.getElementById('itemQty');

            const finalName = name || nameInput.value.trim();
            const finalPrice = price !== null ? parseFloat(price) : parseFloat(priceInput.value);
            const finalQty = qty || parseInt(qtyInput.value) || 1;

            if (!finalName || isNaN(finalPrice) || finalPrice <= 0) {
                alert('Pehle Sahi Name aur Price Enter Karein! ⚠️');
                return;
            }

            saveToSuggestions(finalName, finalPrice);

            state.items.push({
                id: Date.now(),
                name: finalName,
                price: finalPrice,
                qty: finalQty,
                completed: false
            });

            if (!name) {
                nameInput.value = '';
                priceInput.value = '';
                qtyInput.value = '1';
                document.getElementById('suggestionsDropdown').style.display = 'none';
            }

            saveState();
            render();
            renderChips();
        }

        function startVoiceInput() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return alert("Browser Speech Recognition support nahi karta.");
            const recognition = new SpeechRecognition();
            recognition.start();
            recognition.onresult = (e) => {
                const val = e.results[0][0].transcript;
                document.getElementById('itemName').value = val;
                handleItemTyping(val);
            };
        }

        function startVoiceInputForAI() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return alert("Browser Speech Recognition support nahi karta.");
            const recognition = new SpeechRecognition();
            recognition.start();
            recognition.onresult = (e) => {
                document.getElementById('chatInput').value = e.results[0][0].transcript;
                fetchGoogleSearchRate();
            };
        }

        function startBarcodeScanner() {
            document.getElementById('scannerArea').style.display = 'block';
            html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 200 });
            html5QrcodeScanner.render((text) => {
                stopBarcodeScanner();
                document.getElementById('itemName').value = `Item (${text.slice(-4)})`;
                document.getElementById('itemPrice').value = 150;
            }, () => {});
        }

        function stopBarcodeScanner() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.clear();
                document.getElementById('scannerArea').style.display = 'none';
            }
        }

        function toggleComplete(id) {
            const item = state.items.find(i => i.id === id);
            if (item) item.completed = !item.completed;
            saveState();
            render();
        }

        function updateQty(id, delta) {
            const item = state.items.find(i => i.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) state.items = state.items.filter(i => i.id !== id);
            }
            saveState();
            render();
        }

        function deleteItem(id) {
            state.items = state.items.filter(i => i.id !== id);
            saveState();
            render();
        }

        function render() {
            state.currency = document.getElementById('currencySelect').value;
            const budget = parseFloat(document.getElementById('budgetLimit').value) || 0;
            state.budget = budget;

            const totalSpent = state.items.reduce((sum, item) => sum + (item.price * item.qty), 0);
            document.getElementById('totalSpent').textContent = `${totalSpent.toFixed(0)} ${state.currency}`;

            const percent = budget > 0 ? Math.min((totalSpent / budget) * 100, 100) : 0;
            document.getElementById('progressBar').style.width = `${percent}%`;

            document.getElementById('progressPercent').textContent = `${percent.toFixed(0)}% Used`;
            document.getElementById('moodContainer').textContent = totalSpent > budget ? '😡' : (totalSpent > budget * 0.75 ? '😟' : '😊');

            const listBody = document.getElementById('listBody');
            listBody.innerHTML = '';

            state.items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'list-item';
                card.innerHTML = `
                    <input type="checkbox" ${item.completed ? 'checked' : ''} onchange="toggleComplete(${item.id})">
                    <div class="item-info">
                        <span class="item-name ${item.completed ? 'completed-text' : ''}">${item.name}</span>
                        <span style="font-size:0.78rem; color:var(--text-sub);">${item.price} ${state.currency} x ${item.qty} = <b>${item.price * item.qty}</b></span>
                    </div>
                    <div class="qty-picker">
                        <button class="qty-btn" onclick="updateQty(${item.id}, -1)">-</button>
                        <span style="font-size:0.85rem; font-weight:700;">${item.qty}</span>
                        <button class="qty-btn" onclick="updateQty(${item.id}, 1)">+</button>
                    </div>
                    <button style="background:transparent; border:none; color:var(--danger); cursor:pointer; font-size:1.1rem;" onclick="deleteItem(${item.id})">🗑️</button>
                `;
                listBody.appendChild(card);
            });
        }

        function shareToWhatsApp() {
            if (state.items.length === 0) return alert("Cart khali hai! Pehle items add karein.");
            let msg = `🛒 *Smart Cart List*\n\n`;
            let total = 0;
            state.items.forEach((item, index) => {
                const sub = item.price * item.qty; total += sub;
                msg += `${index + 1}. ${item.name} - ${item.qty}x @ ${item.price} = *${sub} ${state.currency}*\n`;
            });
            msg += `\n💰 *Total:* ${total} ${state.currency}`;
            window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function renderChips() {
            const container = document.getElementById('suggestionChipsContainer');
            if (!container) return;
            container.innerHTML = '';
            state.learnedItems.slice(0, 5).forEach(item => {
                const chip = document.createElement('button');
                chip.className = 'chip-btn';
                chip.textContent = `💡 ${item.name}`;
                chip.onclick = () => {
                    document.getElementById('chatInput').value = `${item.name} rate`;
                    fetchGoogleSearchRate();
                };
                container.appendChild(chip);
            });
        }

        // DIRECT GOOGLE SEARCH API FETCHING
        async function fetchGoogleSearchRate() {
            const input = document.getElementById('chatInput');
            const userMsg = input.value.trim();
            if (!userMsg) return;

            const chatMessages = document.getElementById('chatMessages');
            chatMessages.innerHTML += `<div class="chat-bubble user">${userMsg}</div>`;
            input.value = '';

            const loadingBubble = document.createElement('div');
            loadingBubble.className = 'chat-bubble ai';
            loadingBubble.innerHTML = `🌐 Searching Google live rate for "<b>${userMsg}</b>"...`;
            chatMessages.appendChild(loadingBubble);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            const searchQuery = encodeURIComponent(`${userMsg} price in ${state.country === 'PK' ? 'pakistan pkr' : state.country}`);
            
            // Using a CORS-anywhere proxy endpoint wrapper for direct client-side requests
            const targetApiUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(`https://api.searchapi.io/api/v1/search?q=${searchQuery}&api_key=${SEARCH_API_KEY}`)}`;

            try {
                const res = await fetch(targetApiUrl);
                const data = await res.json();
                const parseData = JSON.parse(data.contents);

                let extractedPrice = 0;
                let snippetText = "";

                if (parseData.organic_results && parseData.organic_results.length > 0) {
                    snippetText = parseData.organic_results[0].snippet || parseData.organic_results[0].title;
                    const matches = snippetText.match(/(?:Rs\.?|PKR|INR|\$)\s*([\d,]+)/i) || snippetText.match(/([\d,]+)\s*(?:PKR|Rs|Rupees)/i);
                    if (matches) {
                        extractedPrice = parseFloat(matches[1].replace(/,/g, ''));
                    }
                }

                if (!extractedPrice || isNaN(extractedPrice)) {
                    extractedPrice = userMsg.toLowerCase().includes('i5') ? 12500 : 250;
                }

                loadingBubble.innerHTML = `<b>Google Search Result:</b><br>${snippetText ? snippetText.slice(0, 100) + '...' : 'Live Rate Fetched'}<br><br>Estimated Rate: <b>${extractedPrice} ${state.currency}</b> ⚡`;

                const addBtn = document.createElement('button');
                addBtn.className = 'add-from-ai-btn';
                addBtn.innerHTML = `➕ Add "${userMsg}" (${extractedPrice} ${state.currency})`;
                addBtn.onclick = () => {
                    addItem(userMsg, extractedPrice, 1);
                    switchTab('cart');
                };
                loadingBubble.appendChild(document.createElement('br'));
                loadingBubble.appendChild(addBtn);

            } catch (err) {
                // Fallback link if API token limits or CORS blocks
                const googleSearchUrl = `https://www.google.com/search?q=${searchQuery}`;
                loadingBubble.innerHTML = `Direct Search link generated:<br>
                <a href="${googleSearchUrl}" target="_blank" style="color:#06b6d4; font-weight:bold; text-decoration:underline;">
                    👉 Open Google Search for "${userMsg}"
                </a>`;
            }
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.add-item-form')) {
                document.getElementById('suggestionsDropdown').style.display = 'none';
            }
        });

        render();
        renderChips();
    </script>
</body>
</html>
